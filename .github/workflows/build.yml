name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev libbz2-dev libssl-dev libgdbm-dev libncurses5-dev libncursesw5-dev libreadline-dev python3-dev libffi-dev liblzma-dev zip unzip openjdk-17-jdk git
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Generate buildozer.spec
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,pyotp,urllib3,certifi,idna,chardet/g' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/# android.archs = arm64-v8a/android.archs = arm64-v8a/g' buildozer.spec

    - name: Build APK with Buildozer
      env:
        BUILDOZER_WARN_ON_ROOT: 0
        PIP_NO_CACHE_DIR: 1
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlgoTrader-APK
        path: bin/*.apk
