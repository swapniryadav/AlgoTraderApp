name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev libbz2-dev libssl-dev libgdbm-dev libncurses5-dev libncursesw5-dev libreadline-dev python3-dev libffi-dev liblzma-dev zip unzip openjdk-17-jdk git
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer python-for-android

    - name: Download NDK r25b
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip -q android-ndk-r25b-linux.zip -d $HOME
        rm android-ndk-r25b-linux.zip

    - name: Write buildozer.spec
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = AlgoTrader
        package.name = algotrader
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy,requests,pyotp,urllib3,certifi,idna,chardet,setuptools,openssl
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET, ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.ndk_path = /home/runner/android-ndk-r25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      env:
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlgoTrader-APK
        path: bin/*.apk
