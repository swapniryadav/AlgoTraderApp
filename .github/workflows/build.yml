name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create buildozer.spec
      run: |
        yes | buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,pyotp,urllib3,certifi,idna,chardet/g' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        sed -i 's/# android.archs = arm64-v8a/android.archs = arm64-v8a/g' buildozer.spec

    - name: Build APK with Docker
      run: |
        yes | buildozer -v android debug --warn_on_root=0

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlgoTrader-APK
        path: bin/*.apk
